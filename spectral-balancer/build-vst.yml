name: Build VST3 Plugins

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_name: SpectralBalancer_Windows_VST3
            vst_path: build/SpectralBalancer_artefacts/Release/VST3/Spectral Balancer.vst3

          - name: macOS
            os: macos-latest
            artifact_name: SpectralBalancer_macOS_VST3
            vst_path: build/SpectralBalancer_artefacts/Release/VST3/Spectral Balancer.vst3

          - name: Linux
            os: ubuntu-22.04
            artifact_name: SpectralBalancer_Linux_VST3
            vst_path: build/SpectralBalancer_artefacts/Release/VST3/Spectral Balancer.vst3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build Web Assets (Single-File)
        run: |
          npm install
          npm run build

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            mesa-common-dev \
            libgl1-mesa-dev \
            libwebkit2gtk-4.0-dev \
            libcurl4-openssl-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile Plugin
        run: cmake --build build --config Release --parallel

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.vst_path }}

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Zip Artifacts
        run: |
          zip -r SpectralBalancer_Windows.zip SpectralBalancer_Windows_VST3
          zip -r SpectralBalancer_macOS.zip SpectralBalancer_macOS_VST3
          zip -r SpectralBalancer_Linux.zip SpectralBalancer_Linux_VST3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SpectralBalancer_Windows.zip
            SpectralBalancer_macOS.zip
            SpectralBalancer_Linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
